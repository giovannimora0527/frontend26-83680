# Perfil de contenedores (docker-compose define las variables)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://db:3306/clinica?serverTimezone=America/Bogota&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:clinica}
spring.datasource.password=${DB_PASSWORD:clinica}
spring.jpa.show-sql=false
spring.datasource.hikari.initialization-fail-timeout=60000

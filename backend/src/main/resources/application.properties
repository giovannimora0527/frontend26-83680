spring.application.name=clinica
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=8080
server.tomcat.threads.max=64
server.servlet.context-path=/clinica/v1

# JPA: el esquema lo crean los scripts de /database (no se usa ddl-auto)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Carga masiva (archivos Excel/CSV)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Sesiones (token Bearer) en horas
clinica.seguridad.horas-sesion=10

# Datos de la cl\u00ednica para los documentos PDF
clinica.datos.nombre=Cl\u00ednica Veterinaria Uniminuto
clinica.datos.nit=NIT 900.123.456-7
clinica.datos.direccion=Calle 81B # 72B-70, Bogot\u00e1 D.C.
clinica.datos.telefono=(601) 291 6520

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

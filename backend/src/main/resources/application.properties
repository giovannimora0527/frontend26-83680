spring.application.name=clinica-veterinaria-api
server.port=8080
server.servlet.context-path=/clinica/v1
server.error.include-message=never
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Bogota
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/clinica?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=never
spring.jdbc.template.query-timeout=15
logging.level.org.springframework.jdbc.core=INFO

<div class="container-fluid">
    <div class="card">
        <div class="card-header">
            <h5 class="mb-3"><i class="feather icon-user-check"></i>&nbsp;Gestión de Clientes</h5>
            <input class="form-control" placeholder="Buscar cliente" type="text"
                (input)="actualizarBusqueda($event)" />
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped">
                    <thead>
                        <tr>
                                <th class="text-center">Tipo de doc</th>
                                <th class="text-center">Número de doc.</th>
                                <th class="text-center">Nombres</th>
                                <th class="text-center">Apellidos</th>
                                <th class="text-center">Teléfono</th>
                                <th class="text-center">Dirección</th>
                        </tr>
                    </thead>
                    <tbody *ngIf="listClientes.length === 0">
                        <tr>
                            <td colspan="6" class="text-center">No hay clientes registrados</td>
                        </tr>
                    </tbody>
                    <tbody *ngIf="listClientes.length > 0 && clienteFiltrados.length === 0">
                        <tr>
                            <td colspan="6" class="text-center">No se encontraron resultados</td>
                        </tr>
                    </tbody>
                    <tbody *ngIf="clienteFiltrados.length > 0">
                        <tr *ngFor="let item of clientePaginados">
                                <td class="text-center">{{ item.tipoDocumento }}</td>
                                <td class="text-center">{{ item.numeroDocumento }}</td>
                                <td class="text-center">{{ item.nombres }}</td>
                                <td class="text-center">{{ item.apellidos }}</td>
                                <td class="text-center">{{ item.telefono }}</td>
                                <td class="text-center">{{ item.direccion }}</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <nav *ngIf="totalPaginas > 1" aria-label="Paginación de clientes">
                <ul class="pagination justify-content-end mb-0">
                    <li class="page-item" [class.disabled]="paginaActual === 1">
                        <button class="page-link" type="button" [disabled]="paginaActual === 1"
                            (click)="cambiarPagina(paginaActual - 1)">Anterior</button>
                    </li>
                    <li class="page-item" *ngFor="let pagina of paginas" [class.active]="pagina === paginaActual">
                        <button class="page-link" type="button" (click)="cambiarPagina(pagina)">{{ pagina }}</button>
                    </li>
                    <li class="page-item" [class.disabled]="paginaActual === totalPaginas">
                        <button class="page-link" type="button" [disabled]="paginaActual === totalPaginas"
                            (click)="cambiarPagina(paginaActual + 1)">Siguiente</button>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>

<main class="login">
  <div class="card login__tarjeta" *ngIf="form">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <img class="login__logo" src="assets/images/logo_mascotas.png" alt="Logo de la clínica veterinaria" />
        <h1 class="h4 mt-3 mb-1">Clínica Veterinaria</h1>
        <p class="text-muted mb-0">Ingrese con su usuario para continuar</p>
      </div>

      <div class="alert alert-warning py-2" role="status" *ngIf="sesionExpirada">
        Su sesión expiró. Ingrese nuevamente.
      </div>
      <div class="alert alert-danger py-2" role="alert" *ngIf="error">{{ error }}</div>

      <form [formGroup]="form" (ngSubmit)="ingresar()" novalidate>
        <div class="mb-3">
          <label class="form-label" for="username">Usuario</label>
          <input id="username" class="form-control" formControlName="username" autocomplete="username" autofocus
                 [class.is-invalid]="invalido('username')" />
          <div class="invalid-feedback">Escriba su usuario.</div>
        </div>
        <div class="mb-4">
          <label class="form-label" for="password">Contraseña</label>
          <div class="input-group has-validation">
            <input id="password" class="form-control" formControlName="password" autocomplete="current-password"
                   [type]="verClave ? 'text' : 'password'" [class.is-invalid]="invalido('password')" />
            <button type="button" class="btn btn-outline-secondary" (click)="verClave = !verClave"
                    [attr.aria-label]="verClave ? 'Ocultar contraseña' : 'Mostrar contraseña'">
              <i class="fas" [ngClass]="verClave ? 'fa-eye-slash' : 'fa-eye'"></i>
            </button>
            <div class="invalid-feedback">Escriba su contraseña.</div>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100" [disabled]="ingresando">
          <span *ngIf="ingresando" class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
          {{ ingresando ? 'Ingresando...' : 'Ingresar' }}
        </button>
      </form>
    </div>
  </div>
</main>

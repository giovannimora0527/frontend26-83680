<main class="container d-flex align-items-center justify-content-center min-vh-100">
  <section class="card shadow-sm w-100" style="max-width: 430px">
    <div class="card-body p-4">
      <h1 class="h4 mb-1">Clínica veterinaria</h1>
      <p class="text-muted mb-4">Ingresa con tu cuenta para continuar.</p>
      <div *ngIf="error" class="alert alert-danger" role="alert">{{ error }}</div>
      <form [formGroup]="form" (ngSubmit)="iniciarSesion()">
        <div class="mb-3">
          <label for="username" class="form-label">Usuario</label>
          <input id="username" class="form-control" formControlName="username" autocomplete="username" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input id="password" type="password" class="form-control" formControlName="password"
            autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary w-100" type="submit" [disabled]="enviando">
          {{ enviando ? 'Ingresando...' : 'Iniciar sesión' }}
        </button>
      </form>
    </div>
  </section>
</main>

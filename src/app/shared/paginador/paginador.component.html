<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mt-2">
  <div class="d-flex align-items-center gap-2">
    <span class="text-muted">Mostrando {{ registroInicial }}–{{ registroFinal }} de {{ totalRegistros }}</span>
    <select class="form-select form-select-sm w-auto" aria-label="Registros por página"
            [ngModel]="tamano" (ngModelChange)="cambiarTamano($event)">
      <option *ngFor="let n of opciones" [ngValue]="n">{{ n }} por página</option>
    </select>
  </div>
  <nav [attr.aria-label]="etiqueta" *ngIf="totalPaginas > 1">
    <ul class="pagination pagination-sm mb-0">
      <li class="page-item" [class.disabled]="pagina === 0">
        <button type="button" class="page-link" (click)="irA(pagina - 1)">Anterior</button>
      </li>
      <li class="page-item" *ngFor="let p of paginasVisibles" [class.active]="p === pagina">
        <button type="button" class="page-link" (click)="irA(p)">{{ p + 1 }}</button>
      </li>
      <li class="page-item" [class.disabled]="pagina >= totalPaginas - 1">
        <button type="button" class="page-link" (click)="irA(pagina + 1)">Siguiente</button>
      </li>
    </ul>
  </nav>
</div>

<div class="usuario-barra">
  <div class="text-end d-none d-md-block">
    <div class="fw-semibold text-white">{{ auth.sesion()?.medicoNombre || auth.sesion()?.username }}</div>
    <small class="text-white-50">{{ auth.sesion()?.perfilNombre }}</small>
  </div>
  <button type="button" class="btn btn-sm btn-outline-light" (click)="auth.logout()">
    <i class="feather icon-log-out"></i> Salir
  </button>
</div>
